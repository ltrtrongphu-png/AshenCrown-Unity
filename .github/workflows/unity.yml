name: Unity EditMode Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editmode:
    name: EditMode tests (Unity license required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run EditMode tests
        if: ${{ secrets.UNITY_LICENSE != '' }}
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: EditMode
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Explain why tests were skipped
        if: ${{ secrets.UNITY_LICENSE == '' }}
        run: |
          echo "::warning::Unity EditMode tests were not run because UNITY_LICENSE is not configured."
          echo "Configure UNITY_LICENSE (and the credentials required by your chosen GameCI licensing method) before using this workflow as a test result."
