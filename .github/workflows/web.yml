name: Web CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: Build and validate browser demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check deployment references and save schema
        run: npm run check:refs
      - name: Run web utility tests
        run: npm run test:web
      - name: Build allow-listed Vercel artifact
        run: node tools/build-web.mjs
      - name: Assert deployment assets exist
        run: |
          test -s dist/index.html
          test -s dist/play.html
          test -s dist/assets/ashen-crown-logo.svg
          test -s dist/vendor/three.module.js
          test -s dist/vendor/three.core.js
          test -s dist/resource-pack.json
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashencrown-web-dist
          path: dist/
